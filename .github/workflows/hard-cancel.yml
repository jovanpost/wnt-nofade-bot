name: Hard cancel at 5:29 PM CT

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      immediate:
        description: "Cancel right now instead of waiting for 17:29 CT"
        type: boolean
        default: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests cryptography SQLAlchemy psycopg2-binary
      - name: Cancel everything resting
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USE_DEMO: ${{ vars.USE_DEMO || 'false' }}
          DRY_RUN: "false"
          TELEGRAM_COMMANDS: "false"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.immediate }}" = "true" ]; then
            python -m scripts.cancel_all
          else
            python -m scripts.cancel_all --wait-until 17:29
          fi
      - name: Shout if the cancel failed
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="GitHub Actions backup cancel FAILED. Open Kalshi and check for resting orders NOW."
